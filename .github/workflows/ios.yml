name: Build unsigned iOS IPA

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        shell: bash
        run: |
          XCODE=$(find /Applications -maxdepth 1 -name 'Xcode_16*.app' -print | sort -V | tail -1)
          if [[ -n "$XCODE" ]]; then
            sudo xcode-select -s "$XCODE/Contents/Developer"
          else
            echo "No Xcode 16 app found; using runner default: $(xcode-select -p)"
          fi
          xcodebuild -version

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project _Build_/Xcode/Einstein.xcodeproj \
            -scheme iOSEinstein \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Package unsigned IPA
        run: |
          APP=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -name '*.app' -print | head -1)
          echo "Found app: $APP"
          test -n "$APP"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          (cd "$RUNNER_TEMP" && zip -r Einstein-unsigned.ipa Payload)

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Einstein-unsigned-ipa
          path: ${{ runner.temp }}/Einstein-unsigned.ipa
          if-no-files-found: error
